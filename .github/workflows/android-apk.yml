# Compile l'application Android (mobile/) et publie l'APK dans une Release GitHub,
# téléchargeable directement depuis le téléphone :
#   https://github.com/<propriétaire>/<dépôt>/releases/latest/download/anime-tiktok-studio.apk
name: Application Android

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Clé de signature (secrets du dépôt, si présents)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          EOF

      - name: Compilation de l'APK
        run: |
          flutter build apk --release --build-number ${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk anime-tiktok-studio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: anime-tiktok-studio-apk
          path: mobile/anime-tiktok-studio.apk

      - name: Publication (Release GitHub)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-build-${{ github.run_number }}
          name: Anime TikTok Studio (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            APK Android de l'application de contrôle, compilé depuis `${{ github.ref_name }}` (${{ github.sha }}).
            Sur le téléphone : téléchargez `anime-tiktok-studio.apk`, ouvrez-le et autorisez l'installation.
          files: mobile/anime-tiktok-studio.apk
